<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp</title>
<link rel="icon" type="image/png" id="favicon">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/*__STYLE__*/
</style>
</head>
<body data-view="main">

<section class="connect" id="connect" aria-label="Connect to Archipelago">
  <form class="card frame" id="connect-form" autocomplete="on">
    <span class="logo title"><img class="brand" data-logo alt="">SkillUp</span>
    <p class="sub">An Archipelago idle game of Classic WoW professions</p>
    <div class="fld"><label for="c-server">Server</label><input id="c-server" placeholder="archipelago.gg:38281" autocomplete="url">
      <span class="hint">The room's address and port, as shown on its page.</span></div>
    <div class="fld"><label for="c-slot">Slot name</label><input id="c-slot" placeholder="Your name from your YAML"></div>
    <div class="fld"><label for="c-pass">Password</label><input id="c-pass" type="password" placeholder="Leave empty if the room has none"></div>
    <p class="err" id="c-err" role="status"></p>
    <button class="wbtn big" type="submit">Connect</button>
    <div class="recent" id="recent"></div>
    <div class="solo" id="solo"></div>
    /*__LINKS__*/
    /*__VERSION__*/
  </form>
</section>

<header class="top frame" id="top" hidden>
  <button class="logo title" id="to-menu" title="Main menu" aria-label="Main menu"><img class="brand" data-logo alt=""><span class="logo-txt">SkillUp</span></button>
  <button class="who" id="to-connect" title="Change room or slot"><span class="online" id="online" aria-hidden="true"></span><b id="who"></b><span class="speed" id="speed"></span><span class="mute" id="where"></span></button>
  <span class="hsep" aria-hidden="true"></span>
  <span class="hstats">
  <span class="hstat"><span class="k">Gold</span><span class="coins" id="gold"></span></span>
  <span class="hstat"><span class="k">Checks</span><b id="checks"></b></span>
  <span class="hstat" title="Time played with the game open (time away doesn't count). Stops when your goal is complete."><span class="k">Played</span><b id="played"></b></span>
  </span>
  <span class="auras" id="auras" role="group" aria-label="Buffs and debuffs"></span>
</header>

<nav class="vtabs" id="vtabs" aria-label="Views" hidden>
  <button data-view="profs">Professions</button><button data-view="main" id="vt-main" aria-current="page">Combat</button><button data-view="panel">Character</button>
</nav>
<main class="grid" id="game" hidden>
  <nav class="frame side" id="profs" aria-label="Professions"><h2 class="h2 title">Professions</h2><div id="proflist"></div></nav>
  <section class="frame" id="main" aria-label="Selected profession"><div class="slots" id="slots"></div><div id="detail"></div></section>
  <aside class="frame right side" id="panel">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="char" role="tab">Character</button>
      <button data-tab="shop" role="tab">Shop</button>
      <button data-tab="bags" role="tab">Bags</button>
      <button data-tab="log" role="tab">Console</button>
    </div>
    <div class="pane" id="pane"></div>
    <div class="goal" id="goal"></div>
  </aside>
</main>
<footer class="site-foot" id="foot" hidden>/*__LINKS__*/<span class="audio-tg">
  <button id="snd-music" data-audio="music" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5V6l11-2.5v12"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/></svg></button>
  <button id="snd-sfx" data-audio="sfx" aria-label="Sound effects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="wave wave2" d="M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
</span>/*__VERSION__*/</footer>

<script>
const GD = /*__GAME_DATA__*/null;
const BAL = /*__BALANCE__*/null;
const LOGO = "/*__LOGO__*/";
/*__SCRIPT__*/
</script>
</body>
</html>
