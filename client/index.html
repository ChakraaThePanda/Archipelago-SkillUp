<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillUp</title>
<link rel="icon" type="image/png" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: borrows Classic WoW's own interface language. Night-blue tooltip panels with steel
   borders, gold titles, the blue Skills-tab bars, the yellow cast bar for running actions,
   red-and-gold buttons, red nameplates on creatures. Three columns on a wide second monitor:
   professions | the selected profession | character / shop / storage / log. */
:root {
  color-scheme: dark;
  --night: #05060d;
  --panel: rgba(10, 12, 30, .94);
  --panel-hi: rgba(22, 26, 56, .95);
  --steel: #6f7690;          /* tooltip border */
  --steel-dk: #2a2f48;
  --ink: #f4f1ea;
  --mute: #a3a9c2;
  --gold: #ffd100;            /* WoW title gold */
  --gold-dk: #b38a00;
  --skill: #2350c8;           /* Skills tab bar */
  --skill-hi: #4f7fff;
  --cast: #ffb400;            /* casting bar */
  --rested: #3f6cff;
  --hp: #12b81a; --hp-foe: #d11a1a;
  --btn: #8f0f0f; --btn-dk: #4a0505;
  --q1: #ffffff; --q2: #1eff00; --q3: #0070dd; --q4: #a335ee;
  --red: #ff2020; --orange: #ff8040; --yellow: #ffff00; --green: #40c040; --grey: #808080;
  --f-title: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-ui: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
img { max-width: 100%; } /* same default the artifact viewer adds, so local tests match */
/* Icons are always square: never shrunk by a tight row, never stretched. */
.icon, .eq img, .mats li img, .coins img, .card .links svg { max-width: none; flex: none; aspect-ratio: 1 / 1; object-fit: cover; }
[hidden] { display: none !important; }
.top, .grid, .site-foot { width: 100%; max-width: 1480px; margin-inline: auto; } /* wide screens: keep rows readable */
html, body { background: var(--night); color: var(--ink); }
html { scrollbar-gutter: stable; overflow-y: scroll; }
body {
  margin: 0; font-family: var(--f-ui); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums;
  background:
    radial-gradient(1200px 700px at 20% -10%, #1a2350 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #2a1238 0%, transparent 55%),
    var(--night);
  min-height: 100vh;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.frame { background: var(--panel); border: 1px solid var(--steel); border-radius: 5px;
  box-shadow: inset 0 0 0 1px #000, 0 0 0 1px #000, 0 10px 30px rgba(0,0,0,.55); min-width: 0; }
.title { font-family: var(--f-title); color: var(--gold); text-shadow: 0 1px 0 #000, 0 0 12px rgba(255, 209, 0, .18); font-weight: 600; letter-spacing: .03em; }
.mute { color: var(--mute); }
.icon { width: 34px; height: 34px; border-radius: 3px; display: block; flex: none; box-shadow: 0 0 0 1px #000, 0 0 0 2px #3b4060; }
.icon.sm { width: 20px; height: 20px; box-shadow: 0 0 0 1px #000; }
.icon.lg { width: 46px; height: 46px; }
.q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); } .q5 { color: #ff8000; }
.c-red { color: var(--red); } .c-orange { color: var(--orange); } .c-yellow { color: var(--yellow); } .c-green { color: var(--green); } .c-grey { color: var(--grey); }
.lvl { font-weight: 700; display: inline-block; min-width: 2.2em; text-shadow: 0 1px 0 #000; }
.coins { display: inline-flex; gap: 5px; align-items: center; font-weight: 600; white-space: nowrap; }
.coins img { width: 13px; height: 13px; border-radius: 50%; }
.wbtn { background: linear-gradient(#b31a1a, var(--btn) 45%, var(--btn-dk)); color: var(--gold); border: 1px solid #000;
  box-shadow: inset 0 0 0 1px #d4a52a66, 0 1px 0 #000; border-radius: 4px; padding: 4px 12px; font-weight: 600; font-size: 14px; text-shadow: 0 1px 0 #000; white-space: nowrap; }
.wbtn:hover { filter: brightness(1.18); }
.wbtn.on { background: linear-gradient(#3c7d24, #24561a 50%, #123a0c); color: #e9ffd8; box-shadow: inset 0 0 0 1px #8fe36a66; }
.wbtn.dim { filter: grayscale(.7) brightness(.7); cursor: not-allowed; }

/* WoW-style bars: text sits on the bar */
.sbar { position: relative; height: 20px; border: 1px solid #000; border-radius: 3px; background: #0a0d1c; box-shadow: 0 0 0 1px #3b4060; overflow: hidden; }
.sbar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#5a86ff, var(--skill) 55%, #13307f); }
.sbar.full > i { background: linear-gradient(#ffe36b, #d6a400 55%, #8a6a00); }
.sbar > span, .cast > span { text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000, 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
.sbar > span { position: relative; display: flex; justify-content: space-between; padding: 0 7px; font-size: 13px; font-weight: 700; line-height: 18px; }
.cast { position: relative; height: 18px; border: 1px solid #000; border-radius: 9px; background: #120d02; box-shadow: 0 0 0 1px var(--steel); overflow: hidden; }
.cast > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ffd75a, var(--cast) 50%, #b06d00); }
.cast > i::after { content: ""; position: absolute; right: -3px; top: -4px; bottom: -4px; width: 7px; background: radial-gradient(#fff 0, #fff8 40%, transparent 70%); }
.cast > span { position: relative; display: block; text-align: center; font-size: 12.5px; font-weight: 700; line-height: 16px; }
.cast.green > i { background: linear-gradient(#8cf26b, #3ea81f 50%, #1b5e0b); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; padding: 9px 16px; }
.logo { font-size: 26px; font-weight: 700; letter-spacing: .05em; line-height: 1; }
.hstat { display: flex; align-items: center; gap: 8px; }
.hstat .k { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.who { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 8px; text-align: left; line-height: 1.2; }
.who > span:last-child { display: flex; align-items: center; gap: 5px; }
.who:hover b { color: var(--gold); }
.online { width: 9px; height: 9px; border-radius: 50%; background: var(--hp); box-shadow: 0 0 8px var(--hp); flex: none; }

/* grid */
.grid { display: grid; grid-template-columns: 232px minmax(0, 1fr) 316px; gap: 14px; margin-top: 14px; align-items: start; }
.h2 { font-size: 15px; margin: 0; padding: 11px 14px 9px; border-bottom: 1px solid var(--steel-dk); }
.glabel { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); padding: 12px 14px 4px; }

/* profession list */
.prof { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 10px; align-items: center; width: 100%; background: none; border: 0;
  border-left: 3px solid transparent; padding: 7px 12px 7px 11px; text-align: left; }
.prof:hover { background: rgba(79, 127, 255, .08); }
.prof.sel { border-left-color: var(--gold); background: rgba(255, 209, 0, .06); }
.prof.active { background: linear-gradient(90deg, rgba(31, 160, 46, .26), rgba(31, 160, 46, .06)); }
.prof.active .nm { color: #8dff8d; }
.prof .icon { grid-row: span 2; }
.prof > * { min-width: 0; }
.prof .nm { font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; white-space: nowrap; }
.prof .nm > :first-child { overflow: hidden; text-overflow: ellipsis; }
.prof .nm small { color: var(--mute); font-weight: 400; font-size: 12px; flex: none; }

/* running actions */
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; border-bottom: 1px solid var(--steel-dk); }
.slot { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.slot > div { min-width: 0; }
.slot .k, .slot .what, .slot .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.slot .what { font-weight: 700; font-size: 16px; line-height: 1.25; }
.slot .sub { font-size: 13px; color: var(--mute); }
.slot .cast { grid-column: 1 / 3; }

/* selected profession */
.dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 14px 8px; }
.dhead h3 { margin: 0; font-size: 22px; line-height: 1.1; }
.dhead .rk { color: var(--mute); font-size: 14px; margin-top: 3px; }
.mini { margin-left: auto; display: grid; gap: 5px; font-size: 12.5px; }
.mt { display: grid; grid-template-columns: 40px 100px 36px; gap: 7px; align-items: center; }
.mt b { color: var(--hp); text-align: right; }
.pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.pips i { height: 8px; border-radius: 1px; background: #0a0d1c; box-shadow: 0 0 0 1px #2a2f48; }
.pips i.on { background: linear-gradient(#ffe36b, #c99700); box-shadow: 0 0 0 1px #000; }
.rtabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 4px 14px 12px; }
.rtabs button { background: #0b0e22; border: 1px solid var(--steel-dk); border-radius: 4px; padding: 5px 6px; color: var(--mute); font-size: 14px; font-weight: 600;
  display: grid; justify-items: center; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rtabs button:hover { border-color: var(--steel); }
.rtabs button.on { color: var(--gold); border-color: var(--gold-dk); background: #1a1708; }
.rtabs button small { color: var(--mute); font-size: 11.5px; font-weight: 400; }
.rows { display: grid; grid-template-columns: 36px minmax(0, 1fr) max-content max-content max-content; column-gap: 14px; row-gap: 2px; padding: 0 8px 12px; }
.row { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; column-gap: 16px; align-items: center; padding: 8px 8px; border-radius: 4px; }
.row:nth-child(odd) { background: rgba(255, 255, 255, .025); }
.row:hover { background: rgba(79, 127, 255, .1); }
.row .nm { font-weight: 600; font-size: 15.5px; }
.row .nmline { display: block; min-width: 0; line-height: 1.25; }
.row .nmline > * { line-height: 1.2; }
.row .meta .cat { font-size: 13px; color: var(--mute); white-space: nowrap; }
.row > .icon { width: 36px; height: 36px; align-self: start; margin-top: 2px; object-fit: cover; }
.row .info { min-width: 0; align-self: center; }
.mats { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; font-size: 13px; justify-content: start; }
.mats li { display: grid; grid-template-columns: 18px minmax(0, auto) auto; align-items: center; gap: 7px; white-space: nowrap; }
.mats li .have::before { content: "("; } .mats li .have::after { content: ")"; }
.mats li img { width: 18px; height: 18px; border-radius: 2px; box-shadow: 0 0 0 1px #000; }
.mats li .have { color: var(--mute); }
.mats li.short span:nth-child(2) { color: var(--red); }
.row > .chk { font-size: 13px; font-weight: 700; white-space: nowrap; align-self: center; justify-self: end; text-align: right; }
.row .meta { display: flex; align-items: center; gap: 4px 12px; font-size: 13.5px; color: var(--mute); margin-top: 1px; }
.row .act .wbtn { width: 100%; }
.row .act { min-width: 84px; }
.row .rate { text-align: right; font-size: 13px; color: var(--mute); white-space: nowrap; }
.row .rate b { color: var(--ink); font-size: 16px; }
.chk { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chk.todo { color: var(--gold); } .chk.done { color: #6fa97a; font-weight: 400; }
.locked { padding: 26px 16px; text-align: center; color: var(--mute); font-size: 16px; }

/* combat: always 4 creatures */
.zone { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; padding: 0 14px 6px; }

.zone .title { font-size: 16px; white-space: nowrap; }
.mobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 14px 16px; }
.mob { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: center; padding: 12px 14px 14px; border-radius: 5px;
  background: radial-gradient(circle at 50% 38%, #26305e 0%, #0d1028 62%); border: 1px solid var(--steel-dk); }
.mob.boss { border-color: var(--gold-dk); background: radial-gradient(circle at 50% 38%, #4a2a12 0%, #1a0d07 62%); }
.mob img { width: 100%; max-width: 170px; aspect-ratio: 1; object-fit: contain; margin: 0 auto -4px; filter: drop-shadow(0 6px 6px #000); }
.plate { display: grid; gap: 3px; }
.plate .nm { font-weight: 700; font-size: 14px; line-height: 1.15; min-height: 2.3em; display: grid; align-items: end; color: #ffeb3b; text-shadow: 0 1px 1px #000; }
.mob.boss .plate .nm { color: #ff9a3c; }
.plate .lv { font-size: 12.5px; color: var(--mute); }
.trait { justify-self: center; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; color: #ffcf8a; background: #3a2208; border: 1px solid #7a4a12; }
.mob .rate { font-size: 13px; }
.gearrow { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
.gear { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.gear svg { width: 13px; height: 13px; fill: currentColor; filter: drop-shadow(0 1px 0 #000); }
.verdict { font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 11.5px; padding: 1px 7px; border-radius: 3px; border: 1px solid currentColor; background: #0a0d1c; }
.v-safe { color: var(--green); } .v-risky { color: var(--yellow); } .v-deadly { color: var(--red); }
.mob .wbtn { align-self: center; margin-top: auto; }
.mob .trait { position: absolute; top: 10px; right: 10px; z-index: 1; }

/* right column */
.tabs { display: flex; justify-content: space-evenly; gap: 2px; padding-inline: 10px; border-bottom: 1px solid var(--steel-dk); }
.tabs button { flex: none; background: none; border: 0; padding: 11px 8px 9px; font-family: var(--f-title); font-weight: 600; letter-spacing: .02em; font-size: 12.5px; color: var(--mute); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--gold); border-bottom-color: var(--gold); }
.pane { padding: 14px; }
.doll { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; gap: 10px; align-items: start; }
.doll .col { display: grid; gap: 9px; align-content: start; }
.eq { width: 54px; height: 54px; border-radius: 4px; position: relative; background: #0a0d1c; box-shadow: 0 0 0 1px #000, 0 0 0 2px #3b4060; }
.eq img { width: 100%; height: 100%; border-radius: 4px; display: block; }
.eq.empty img { opacity: .5; }
.eq.q5 { box-shadow: 0 0 0 1px #000, 0 0 0 2px #ff8000; }
.eq.q1 { box-shadow: 0 0 0 1px #000, 0 0 0 2px #e8e8e8; }
.eq.q2 { box-shadow: 0 0 0 1px #000, 0 0 0 2px var(--q2); } .eq.q3 { box-shadow: 0 0 0 1px #000, 0 0 0 2px var(--q3); } .eq.q4 { box-shadow: 0 0 0 1px #000, 0 0 0 2px var(--q4); }
.stats { display: grid; align-content: center; gap: 12px; text-align: center; }
.stats .v { font-family: var(--f-title); font-weight: 700; font-size: 26px; color: var(--gold); line-height: 1; text-shadow: 0 1px 0 #000; }
.stats .v.hp { color: #7dff7d; font-size: 22px; }
.stats .v.gl { font-size: 22px; }
.glbar { position: relative; height: 6px; margin: 5px auto 0; width: 80%; border-radius: 3px; box-shadow: 0 0 0 1px #000;
  background: linear-gradient(90deg, #9d9d9d 0%, #ffffff 20%, #1eff00 40%, #0070dd 60%, #a335ee 80%, #ff8000 100%); }
.glbar i { position: absolute; top: -3px; width: 3px; height: 12px; background: #fff; box-shadow: 0 0 0 1px #000; transform: translateX(-50%); }
.stats .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.subh { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 16px 0 7px; }
.subh span { text-transform: none; letter-spacing: 0; }
.irow { display: flex; flex-wrap: wrap; gap: 9px; }
.irow .eq { width: 42px; height: 42px; }
.weapons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: 12.5px; color: var(--mute); }
.weapons .eq { width: 42px; height: 42px; margin: 0 auto 3px; }
.weapons .now { color: var(--gold); }
.timer { position: absolute; left: 0; right: 0; bottom: -1px; text-align: center; font-size: 11.5px; font-weight: 700; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
.count { position: absolute; right: 3px; bottom: 0; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px #000; }

/* shop */
.shophead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; color: var(--mute); font-size: 13.5px; padding-bottom: 8px; border-bottom: 1px solid var(--steel-dk); }
.shophead .coins { color: var(--ink); font-size: 16px; }
.trainer { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 5px 9px; padding: 9px 0; border-bottom: 1px solid var(--steel-dk); }
.trainer .icon { grid-row: span 3; }
.trainer .tn { font-weight: 600; }
.trk { display: grid; grid-template-columns: 40px minmax(48px, 1fr) 50px auto; grid-template-areas: "tl pips bonus buy"; gap: 6px 8px; align-items: center; font-size: 13px; min-width: 0; }
.trk .tl { grid-area: tl; color: var(--mute); white-space: nowrap; } .trk .pips { grid-area: pips; } .trk .bonus { grid-area: bonus; color: var(--hp); font-weight: 700; text-align: right; white-space: nowrap; } .trk .wbtn { padding: 2px 9px; font-size: 13px; }
.trk .wbtn .coins img { width: 11px; height: 11px; }
.trk .wbtn, .trk .maxed { grid-area: buy; width: 74px; padding-inline: 3px; justify-self: end; text-align: center; }
.trk .wbtn .coins { justify-content: center; }
.trk .maxed { color: var(--gold); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
@media (max-width: 460px) { .trk { grid-template-columns: 42px minmax(0, 1fr) auto; grid-template-areas: "tl bonus buy" "pips pips pips"; } }

/* storage + log */
.li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--steel-dk); }
.li .sbar { grid-column: 2 / 4; height: 16px; } .li .sbar > span { line-height: 14px; font-size: 12px; }
.log p { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--steel-dk); font-size: 14.5px; }
.log time { color: var(--mute); font-size: 12.5px; margin-right: 6px; }
/* Archipelago's standard text colors */
.it-prog { color: #af99ef; font-weight: 700; } .it-use { color: #6d8be8; font-weight: 600; } .it-fill { color: #00eeee; } .it-trap { color: #fa8072; font-weight: 600; }
.pl { color: #fafad2; font-weight: 600; } .pl-me { color: #ee00ee; font-weight: 700; } .loc { color: #00ff7f; } .ent { color: #6495ed; }

/* goal */
.goal { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px 14px; border-top: 1px solid var(--steel-dk);
  background: radial-gradient(circle at 0% 50%, rgba(255, 96, 0, .18), transparent 60%); }
.goal img { width: 70px; height: 70px; object-fit: contain; filter: drop-shadow(0 0 10px #ff5a00); }
.goal ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13.5px; display: grid; gap: 2px; }
.ok { color: var(--green); } .no { color: var(--mute); }

/* connect */
.connect { min-height: calc(100vh - 60px); display: grid; place-items: center; padding-block: 20px; }
.card { width: 100%; max-width: 440px; padding: 30px 28px 20px; }
.card .logo { display: block; text-align: center; font-size: 40px; }
.card .sub { text-align: center; color: var(--mute); margin: 6px 0 22px; }
.fld { display: grid; gap: 5px; margin-bottom: 13px; }
.fld label { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.fld input { font: inherit; font-size: 16px; color: var(--ink); background: #070916; border: 1px solid var(--steel-dk); border-radius: 4px; padding: 9px 11px; width: 100%; box-shadow: inset 0 1px 3px #000; }
.fld input:focus { border-color: var(--gold-dk); outline: none; box-shadow: inset 0 1px 3px #000, 0 0 0 2px #ffd10033; }
.fld .hint { font-size: 12.5px; color: var(--mute); }
.card .wbtn.big { width: 100%; padding: 10px; font-family: var(--f-title); font-weight: 700; letter-spacing: .06em; font-size: 16px; margin-top: 4px; }
.recent { margin-top: 18px; border-top: 1px solid var(--steel-dk); padding-top: 10px; }
.recent button { display: grid; grid-template-columns: 1fr auto; width: 100%; text-align: left; background: #0b0e22; border: 1px solid var(--steel-dk); border-radius: 4px; padding: 8px 11px; margin-top: 7px; gap: 2px 10px; }
.recent:empty { display: none; }

.links a { color: var(--mute); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.links a:hover { color: var(--gold); }
.footer-icon { width: 15px; height: 15px; fill: var(--gold); }
.ldot { color: var(--gold); font-size: 9px; align-self: center; }

@media (max-width: 1180px) { .grid { grid-template-columns: 232px minmax(0, 1fr); } .right { grid-column: 1 / -1; }
  .right > .pane, .right > .goal { max-width: 420px; margin-inline: auto; } }
.right { width: 100%; min-width: 0; overflow: hidden; }
.pane { overflow-wrap: anywhere; }
@media (max-width: 520px) { .mobs { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 780px) { .grid { grid-template-columns: minmax(0, 1fr); } .slots { grid-template-columns: 1fr; }
  /* phone rows: name and check on top, materials full width, then pace and the button */
  .rows { display: block; padding: 0 6px 10px; }
  .row { grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "icon name chk" "icon meta chk" "mats mats mats" "rate rate act";
    column-gap: 10px; row-gap: 4px; padding: 10px 8px; }
  .row .info { display: contents; }
  .row > .icon { grid-area: icon; } .row .nmline { grid-area: name; } .row .meta { grid-area: meta; } .row .mats { grid-area: mats; margin: 4px 0 0; }
  .row > .chk { grid-area: chk; align-self: start; } .row .rate { grid-area: rate; text-align: left; align-self: center; } .row .rate br { display: none; }

  .mats li { white-space: normal; grid-template-columns: 18px minmax(0, 1fr) auto; }

/* ---- real game additions ---- */
body { display: flex; flex-direction: column; }
.grid { flex: none; }
.site-foot { margin-top: auto; width: 100%; max-width: 1480px; margin-inline: auto; padding-top: 18px; }
.site-foot .links { border-top: 1px solid var(--steel-dk); margin-top: 0; padding-top: 14px; }
.err { color: var(--red); font-size: 14px; min-height: 1.2em; margin: 0 0 6px; }
.vtabs { display: none; }
.online.off { background: var(--red); box-shadow: 0 0 8px var(--red); }
.wbtn:disabled { filter: grayscale(.8) brightness(.6); cursor: not-allowed; }
.wait { color: var(--orange); font-size: 13px; }
.log p .sys { color: var(--mute); }
.log .hint { color: #c08cff; }
.ragbtn { margin-top: 8px; }
.toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { background: var(--panel-hi); border: 1px solid var(--gold-dk); color: var(--ink); padding: 9px 16px; border-radius: 6px;
  box-shadow: 0 10px 30px #000a; font-size: 14px; animation: toast-in .25s ease-out; transition: opacity .4s, transform .4s; }
.toast.sent { border-color: var(--steel); }
.toast.out { opacity: 0; transform: translateY(10px); }
@keyframes toast-in { from { opacity: 0; transform: translateY(18px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; transition: opacity .4s; } .toast.out { transform: none; } }
.legendary-lbl { color: #ff8000; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 10px 8px 2px; }
@media (max-width: 780px) {
  .hide-sm { display: none; }
  .top { gap: 8px 14px; }

  .vtabs:not([hidden]) { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; position: sticky; top: 0; z-index: 20;
    padding: 6px 8px; background: var(--bg, #05060f); border-bottom: 1px solid var(--steel-dk); }

}

/* the logo: the Engineering gear next to the title */
.logo { display: inline-flex; align-items: center; gap: .3em; }
.logo .brand { width: 1.15em; height: 1.15em; aspect-ratio: 1 / 1; flex: none; border-radius: 6px; box-shadow: 0 0 0 1px var(--gold-dk), 0 2px 8px #000a; }
.card .logo { display: flex; justify-content: center; }

/* the console: a scrolling box, a color key, and a chat line */
.log { height: clamp(320px, 58vh, 660px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.say { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--steel-dk); }
.say input { flex: 1; min-width: 0; background: #0b0e22; border: 1px solid var(--steel-dk); border-radius: 4px; color: var(--ink); padding: 7px 9px; font: inherit; font-size: 14px; }
.say input:focus { outline: none; border-color: var(--gold-dk); }
.say .wbtn { padding: 6px 14px; }

/* ambush: a full-screen fight, and a pulsing red slot while it lasts */
.ambush-ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(circle at 50% 45%, rgba(90, 10, 12, .55), rgba(0, 0, 0, .85)); animation: amb-in .25s ease-out; }
.ambush-ov[hidden] { display: none; }
.amb-card { width: min(420px, 100%); padding: 20px 22px 18px; display: grid; gap: 10px; justify-items: center; text-align: center;
  border-color: var(--red); box-shadow: 0 0 0 1px #000, 0 0 40px rgba(220, 40, 40, .45), 0 20px 60px #000; }
.amb-title { font-family: var(--f-title); font-weight: 700; font-size: 30px; letter-spacing: .06em; color: #ff4a3a; text-shadow: 0 2px 6px #000; }
.amb-title.won { color: var(--gold); }
.amb-sub { color: var(--mute); font-size: 14px; }
.amb-mob { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 8px 8px #000); }
.amb-card .plate { justify-items: center; } .amb-card .plate .nm { min-height: 0; font-size: 18px; }
.amb-bars { width: 100%; display: grid; gap: 8px; text-align: left; }
.amb-k { font-size: 12px; color: var(--mute); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.sbar.foe > i { background: linear-gradient(#e83030, var(--hp-foe) 55%, #7d0d0d); transition: width .25s linear; }
.sbar.you > i { background: linear-gradient(#5fe05f, var(--hp) 55%, #1d6b1d); transition: width .25s linear; }
@keyframes amb-in { from { opacity: 0; } }
.slot.ambushed { border-radius: 5px; outline: 1px solid var(--red); outline-offset: 3px; animation: ambush-pulse 1.2s ease-in-out infinite; }
.slot.ambushed .k { color: #ff5a4a; font-weight: 800; }
@keyframes ambush-pulse { 50% { box-shadow: 0 0 18px rgba(220, 40, 40, .6); } }
@media (prefers-reduced-motion: reduce) { .slot.ambushed, .ambush-ov { animation: none; } .sbar > i { transition: none; } }

/* debuffs, top right of the header */
.debuffs { margin-left: auto; display: flex; gap: 8px; }
.debuffs:empty { display: none; }
.debuff { display: grid; justify-items: center; gap: 1px; font-size: 11.5px; font-weight: 700; color: #ff8a7a; line-height: 1; }
.debuff .icon { width: 28px; height: 28px; border: 1px solid #a01818; border-radius: 3px; box-shadow: 0 0 6px rgba(220, 40, 40, .5); }

/* tooltips, skinned like the game's: dark navy, silver border, item name in its quality color */
.tt { position: fixed; z-index: 80; max-width: 290px; padding: 7px 10px 8px; pointer-events: none;
  background: rgba(8, 9, 28, .95); border: 1px solid #b9b9c9; border-radius: 4px;
  box-shadow: inset 0 0 0 1px #2b2c44, 0 0 0 1px #000, 0 6px 18px rgba(0, 0, 0, .7);
  color: #fff; font-size: 13.5px; line-height: 1.35; display: grid; gap: 1px; }
.tt[hidden] { display: none; }
.tt .tt-name { font-size: 15px; font-weight: 700; margin-bottom: 1px; }
.tt .tt-row { display: flex; justify-content: space-between; gap: 18px; }
.tt .tt-gold { color: #ffd100; } .tt .tt-green { color: #1eff00; } .tt .tt-red { color: #ff2020; } .tt .tt-mute { color: #b8b8c8; }
.tt .tt-sell { margin-top: 2px; } .tt .coins img { width: 12px; height: 12px; }
/* what you're pointing at */
.hot { outline: 1px solid rgba(255, 209, 0, .75); outline-offset: 1px; box-shadow: 0 0 10px rgba(255, 209, 0, .35); border-radius: 3px; }
.eq.hot, .icon.hot { outline-offset: 0; }
.weapons > div.hot { outline-offset: 3px; border-radius: 4px; }

/* the fighting slot: its health above yours */
.slot .fight { grid-column: 1 / 3; display: grid; gap: 4px; }

.slot .fight .sbar > span { font-size: 12px; line-height: 14px; }
.slot .fight .sbar > i { transition: width .2s ease-out; }

function colorOf(level, unlock) {
  const gap = level - unlock;
  if (gap < 0) {
    const chance = BAL.red.chances.find(([upto]) => -gap <= upto)[1];
    return { name: "red", mult: 1, chance, slow: 1 + -gap / BAL.red.slow_per_levels };
  }

  if (GATHER.includes(k)) s *= 1 + buffValue("Gathering speed");
  if (CRAFT.includes(k)) s *= 1 + buffValue("Crafting speed");
  if (k === "combat" && active(S.debuffs, "Resurrection Sickness")) s *= BAL.traps["Resurrection Sickness"].combat_slow;

  }
  const e = BY_NAME[a.name], k = e.profession, kind = slot === "field" ? "gather_time" : "craft_time";
  let t = Math.max(baseTime(kind, e.rank, slotNum(e)) / speed(k), BAL.actions.min_action_time);
  const c = colorOf(S.level[k], e.unlock);
  if (c.name === "red") t *= c.slow;

}
const qtyOf = r => r.legendary ? BAL.recipes.fr_qty : Math.ceil(BAL.recipes.reagent_qty * (BAL.recipes.role_qty_mult[r.role] || 1));
const missing = r => r.reagents.find(n => (S.stock[n] || 0) < qtyOf(r));

function addXp(k, amount, field) {
  if (!learned(k) || S.level[k] >= cap(k)) return;
  amount *= gameSpeed() * (1 + S.xpLv[k] * BAL.gold.xp_step) * (1 + buffValue(field ? "Gathering XP food" : "Crafting XP food"));
  if (S.rested > 0) amount *= 2;
  S.xp[k] += amount;
  while (S.level[k] < cap(k) && S.xp[k] >= xpNeed(S.level[k])) {
    S.xp[k] -= xpNeed(S.level[k]);
    S.level[k]++;
    const r = RANK_CAPS.indexOf(S.level[k]);
    if (r >= 0) check(milestoneName(k, r));
  }
  if (S.level[k] >= cap(k)) S.xp[k] = 0;
}

function baseValue(name) {
  const e = BY_NAME[name];
  if (!e) return 0;
  if (e.reagents) return e.reagents.reduce((t, n) => t + baseValue(n) * qtyOf(e), 0) * BAL.gold.crafted_markup;
  return Math.max(BAL.gold.min_sell, e.sell * BAL.gold.sell_mult);
}
const sellValue = name => baseValue(name) * (1 + S.sellBonus);
function store(name, qty, offline) {
  const kept = Math.min(qty, Math.max(0, bagCap() - (S.stock[name] || 0)));
  S.stock[name] = (S.stock[name] || 0) + kept;
  if (qty > kept && !offline) S.gold += (qty - kept) * sellValue(name);
}

function finishField(offline) {
  const a = actionOf("field");
  if (!a) return;
  if (a.kind === "ragnaros") return finishRagnaros(offline);
  if (a.kind === "mob") return finishFight(a.entry, offline, false, takeFate(a.entry));
  const e = a.entry, k = a.k, base = baseTime("gather_time", e.rank, e.slot);
  if (a.color.name === "red" && Math.random() >= a.color.chance) return;      // failed attempt: only time lost
  addXp(k, base * BAL.actions.xp_per_second * a.color.mult, true);
  store(e.name, BAL.actions.gather_yield, offline);
  first(k, e.name);
}

// How a fight ends. A Healing Potion is drunk only when a fight goes wrong, and saves you half the time.
function rollFight(m) {
  if (Math.random() >= deathChance(m)) return { dies: false, potion: false };
  const potion = (S.supplies.Healing || []).length > 0;
  return { dies: !(potion && Math.random() < .5), potion };
}
function fateFor(m) { // this fight's outcome, rolled once when it starts
  if (S.fightFate?.mob !== m.name) S.fightFate = { ...rollFight(m), mob: m.name };
  return S.fightFate;
}
function takeFate(m) { const f = fateFor(m); S.fightFate = null; return f; }
// What the bars show at time t of a fight lasting `time`: you hit about once a second, it hits back
// about every 1.5 s. Losing: you reach 0 while it keeps about 40%. Winning: it reaches 0, you keep some.
function fightBars(m, time, t, dies) {
  const foeMax = Math.round(needDps(m) * mobBase(m)), youMax = Math.round(maxHp());
  const mine = Math.max(2, Math.round(time)), his = Math.max(1, Math.round(time / 1.5));
  const myHits = Math.min(mine, Math.floor(t / (time / mine) + 1e-9)), hisHits = Math.min(his, Math.floor(t / (time / his) + 1e-9));
  const dmg = dies ? youMax : Math.min(youMax * .9, mobDamage(m));
  return { foe: Math.round(foeMax * (1 - (dies ? .6 : 1) * myHits / mine)), foeMax,
    you: Math.max(dies ? 0 : 1, Math.round(youMax - dmg * hisHits / his)), youMax };
}
function finishFight(m, offline, forced = false, fate = takeFate(m)) {
  if (fate.potion) takeSupply("Healing");
  if (fate.dies) {
    die(`was defeated by ${m.name}`, offline);
    if (!forced && ++S.deathStreak >= 3) easierMob(m, offline);
    return;
  }
  if (!forced) S.deathStreak = 0;
  addXp("combat", mobBase(m) * BAL.actions.xp_per_second * colorOf(S.level.combat, m.unlock).mult, true);
  S.clothAcc += C.cloth_per_kill;
  const cloth = Math.floor(S.clothAcc);
  if (cloth) { S.clothAcc -= cloth; store(m.cloth, cloth, offline); }
  S.gold += C.gold_per_kill * C.rank_growth ** m.rank;
  if (!forced) first("combat", m.name);
}
function easierMob(m, offline) { // after 3 deaths in a row, step down to the next creature you can fight
  S.deathStreak = 0;
  const easier = GD.mobs.filter(x => x.unlock < m.unlock && S.level.combat >= x.unlock && ranks.combat > x.rank)
    .sort((a, b) => b.unlock - a.unlock)[0];
  S.field = easier ? { kind: "mob", name: easier.name } : null;
  if (!offline) toast(easier ? `Died 3 times in a row. Switched to ${easier.name}.` : "Died 3 times in a row. Stopped fighting.");
}
// A death: corpse run, then Resurrection Sickness. quiet = not sent to DeathLink (offline, or it came from DeathLink).
function die(cause, quiet = false) {
  S.deaths++;
  S.corpseUntil = S.clock + C.corpse_run;
  S.debuffs["Resurrection Sickness"] = { until: S.clock + C.corpse_run + BAL.traps["Resurrection Sickness"].minutes * 60 };
  S.fieldT = 0;
  if (!quiet) sendDeathLink(cause);
}

function finishWork(offline) {
  const a = actionOf("work");
  if (!a) return;
  const r = a.entry;
  if (missing(r)) return;                                                    // waits for materials
  if (a.color.name === "red" && Math.random() >= a.color.chance) return;     // failed: materials kept
  for (const n of r.reagents) S.stock[n] -= qtyOf(r);
  if (!r.legendary) addXp(a.k, baseTime("craft_time", r.rank, r.slot) * BAL.actions.xp_per_second * BAL.actions.craft_xp_mult
    * (BAL.recipes.role_xp_mult[r.role] || 1) * a.color.mult, false);
  keepOrSell(r, offline);
  if (!r.legendary) first(a.k, r.name);
}
function keepOrSell(r, offline) { // a crafted item is equipped, kept as a supply, or sold
  const firstTime = !S.crafted.includes(r.name);
  if (firstTime) S.crafted.push(r.name);
  const role = r.role || r.slot;
  if (WEAPONS.includes(role) && (!S.weapons[role] || itemRank(r.name) > itemRank(S.weapons[role]))) return void (S.weapons[role] = r.name);
  if (ARMOR_SLOTS.includes(role) && (!S.armor[role] || ilvl(r.name) > ilvl(S.armor[role]))) return void (S.armor[role] = r.name);
  if (TOOL_FOR[role] && (!S.tools[TOOL_FOR[role]] || r.rank > BY_NAME[S.tools[TOOL_FOR[role]]].rank)) return void (S.tools[TOOL_FOR[role]] = r.name);
  if (role === "Bag" && firstTime) return void S.bags++;
  const kind = r.legendary ? (r.slot === "Potion" ? "Fire protection" : r.slot === "Food" ? "Fire food" : null) : role;
  if (kind && (BUFF_ROLES.includes(kind) || ["Healing", "Fire protection", "Fire food"].includes(kind))) {
    const list = S.supplies[kind] ||= [];
    if (list.length < BAL.buffs.keep) return void list.push(r.name);
  }

}
function takeSupply(kind) {
  const list = S.supplies[kind] || [];
  list.sort((a, b) => BY_NAME[b].rank - BY_NAME[a].rank);
  return list.shift();
}
function refreshBuffs() {
  for (const role of BUFF_ROLES) if (!active(S.buffs, role) && (S.supplies[role] || []).length) {
    const name = takeSupply(role);
    S.buffs[role] = { until: S.clock + BAL.buffs.minutes * 60, rank: BY_NAME[name].rank, name };
  }
}

// ---- Ragnaros --------------------------------------------------------------------------------
function ragnarosOdds() {
  const r = BAL.ragnaros, worn = ARMOR_SLOTS.map(s => S.armor[s]).filter(Boolean);
  let fr = worn.reduce((t, n) => t + (BY_NAME[n].fire_resistance || 0), 0);
  if ((S.supplies["Fire protection"] || []).length) fr += r.potion_fr;
  if ((S.supplies["Fire food"] || []).length) fr += r.food_fr;
  const dps = weaponDps("Tough"), hp = maxHp();
  const win = r.max_win * Math.min(1, dps / r.dps_need) ** 2 * Math.min(1, hp / r.hp_need)
    * (r.fr_floor + (1 - r.fr_floor) * Math.min(1, fr / r.fr_need) ** 2);
  return { win, fr, dps, hp };
}
function finishRagnaros(offline) {
  const { win } = ragnarosOdds();
  takeSupply("Fire protection"); takeSupply("Fire food");
  S.field = null;
  if (Math.random() < win) { S.ragnarosWon = true; toast("Ragnaros is defeated!"); checkGoal(); }
  else { die("was defeated by Ragnaros", offline); toast("Ragnaros won this time. Try again when you're ready."); }
}

// ---- time ------------------------------------------------------------------------------------
// Moves the game forward by dt seconds. Offline (page closed): both slots only repeat what they
// were doing, nothing sells, and the Shop isn't used.
function advance(dt, offline) {
  let guard = 0;
  while (dt > 1e-6 && guard++ < 2e6) {
    refreshBuffs();
    if (S.ambush > 0 && !S.ambushing && !S.field && learned("combat")) startAmbush(offline);   // nothing running: it hits now
    const fa = S.clock < S.corpseUntil ? null : actionOf("field"), wa = actionOf("work");
    const workStuck = wa && missing(wa.entry);
    const tf = fa ? Math.max(0, fa.time - S.fieldT) : Infinity;
    const tw = wa && !workStuck ? Math.max(0, wa.time - S.workT) : Infinity;
    const corpse = S.clock < S.corpseUntil ? S.corpseUntil - S.clock : Infinity;
    const step = Math.min(dt, tf, tw, corpse, 60);
    S.clock += step; dt -= step;
    if (fa) { S.fieldT += step; S.rested = Math.max(0, S.rested - step); }
    if (wa && !workStuck) S.workT += step;
    if (fa && S.fieldT >= fa.time - 1e-9) {
      S.fieldT = 0;
      if (fa.ambush) {
        S.ambushing = null; S.ambush--;
        const deaths = S.deaths;
        finishFight(fa.entry, offline, true, takeFate(fa.entry));
        if (!offline && ambushView) { ambushView.result = S.deaths > deaths ? "lost" : "won"; ambushView.hp = maxHp(); renderAmbush();
          setTimeout(() => { if (ambushView?.result) { ambushView = null; renderAmbush(); } }, 6000); }
      }
      else finishField(offline);
      if (S.ambush > 0 && !S.ambushing && learned("combat") && S.clock >= S.corpseUntil) startAmbush(offline);   // after the current action
    }
    if (wa && !workStuck && S.workT >= wa.time - 1e-9) { S.workT = 0; finishWork(offline); }
  }
}
function startAmbush(offline) {
  S.ambushing = ambushTarget().name; S.fieldT = 0;
  fateFor(MOB[S.ambushing]);   // decided up front, so the fight on screen shows what really happens
  if (!offline) { ambushView = { name: S.ambushing, result: null, hidden: false }; renderAmbush(); }
}
function catchUpOffline() { catchUp(Math.max(0, (Date.now() - S.savedAt) / 1000)); }
function catchUp(away) { // offline rules: page closed, or the tab slept for a long time
  if (away < 5) return;
  const cap = BAL.offline.cap_hours * 3600;
  advance(Math.min(away, cap), true);
  if (away > cap) S.rested = Math.min(S.rested + (away - cap) / 3600 * BAL.offline.rested_per_hour * 60, BAL.offline.rested_cap * 60);
  S.gold += S.unsold; S.unsold = 0;
}

// ---- checks and goal ------------------------------------------------------------------------
function first(k, name) {
  if (!S.firsts.includes(name)) S.firsts.push(name);
  check(locationName(k, name));
}
const pendingChecks = new Set();
function check(locName) { pendingChecks.add(locName); }
function flushChecks() {
  if (!ws || ws.readyState !== 1 || !nameToLoc) return;
  const ids = [...pendingChecks].map(n => nameToLoc[n]).filter(id => id !== undefined && !checked.has(id));
  pendingChecks.clear();
  if (ids.length) { send([{ cmd: "LocationChecks", locations: ids }]); ids.forEach(i => checked.add(i)); }
}
function resendAllChecks() {
  for (const k of Object.keys(P)) {
    for (let r = 0; r < 4; r++) if (S.level[k] >= RANK_CAPS[r]) check(milestoneName(k, r));
    for (let r = 0; r < 4; r++) for (const e of thingsOf(k, r)) if (S.firsts.includes(e.name)) check(locationName(k, e.name));
  }
}
const masteredCount = () => PROFS.filter(p => S.level[p.key] >= 300).length;
function goalDone() {
  const g = slotData.goal || "ragnaros", need = slotData.professions_to_master || 6;
  const rag = S.ragnarosWon, mas = masteredCount() >= need;
  return g === "ragnaros" ? rag : g === "master_professions" ? mas : rag && mas;
}
function checkGoal(resend = false) {
  if ((S.goalSent && !resend) || !goalDone() || !ws || ws.readyState !== 1) return;
  send([{ cmd: "StatusUpdate", status: 30 }]);
  if (!S.goalSent) toast("Goal complete!");
  S.goalSent = true;
}

// ---- items from the multiworld --------------------------------------------------------------
function applyItems() {
  ranks = Object.fromEntries(PROFS.map(p => [p.key, 0]));
  moltenCore = false;
  for (const it of received) {
    const name = itemIdToName[it.item];
    const prof = PROFS.find(p => name === `Progressive ${p.name}`);
    if (prof) ranks[prof.key] = Math.min(4, ranks[prof.key] + 1);
    if (name === "Molten Core") moltenCore = true;
  }
  if (!S) return;
  for (; S.applied < received.length; S.applied++) oneShot(itemIdToName[received[S.applied].item]);
  if (!learned(selected)) selected = PROFS.find(p => learned(p.key))?.key || selected;
}
function oneShot(name) {
  const open = PROFS.map(p => p.key).filter(k => learned(k) && S.level[k] < 300);
  const lowest = list => list.sort((a, b) => S.level[a] - S.level[b])[0];
  switch (name) {
    case "Speed Upgrade": case "XP Upgrade": {
      const lv = name === "Speed Upgrade" ? S.speedLv : S.xpLv;
      const k = open.filter(k => lv[k] < BAL.gold.steps).sort((a, b) => lv[a] - lv[b] || S.level[a] - S.level[b])[0];
      if (k) lv[k]++;
      break;
    }
    case "Bag Upgrade": S.bagBonus += BAL.pool.useful["Bag Upgrade"].storage; break;
    case "Better Prices": S.sellBonus += BAL.pool.useful["Better Prices"].sell; break;
    case "Coin Pouch": {
      const top = Math.max(...PROFS.map(p => Math.floor((S.level[p.key] - 1) / 75)));
      S.gold += BAL.pool.filler["Coin pouch"].gold * C.rank_growth ** top;
      break;
    }
    case "Rested XP": S.rested = Math.min(S.rested + BAL.pool.filler["Rested XP"].rested_min * 60, BAL.offline.rested_cap * 60); break;
    case "Tome of Experience": { const k = lowest(open); if (k) for (let i = 0; i < BAL.pool.filler["Tome of experience"].levels; i++) addXp(k, xpNeed(S.level[k]) / gameSpeed(), true); break; }
    case "Resurrection Sickness": case "Broken Tool":
      S.debuffs[name] = { until: S.clock + BAL.traps[name].minutes * 60 }; break;
    case "Repair Bill": S.gold *= 1 - BAL.traps["Repair Bill"].gold_percent / 100; break;
    case "Murloc Ambush": if (learned("combat")) S.ambush += BAL.traps["Murloc Ambush"].fights; break;
  }
}

// ---- shop --------------------------------------------------------------------------------------
const shopCost = lv => BAL.gold.cost_base * BAL.gold.cost_growth ** lv;
function buy(k, kind) {
  const lv = kind === "speed" ? S.speedLv : S.xpLv;
  if (lv[k] >= BAL.gold.steps || S.gold < shopCost(lv[k])) return;
  S.gold -= shopCost(lv[k]); lv[k]++;
  render();
}
function sell(name) { const n = Math.floor(S.stock[name] || 0); S.gold += n * sellValue(name); S.stock[name] = (S.stock[name] || 0) - n; }
function sellAll(name) { sell(name); render(); }
function sellEverything() { Object.keys(S.stock).forEach(sell); render(); }

// ============================================================================================
// Saving: a copy in this browser + the Archipelago server's data storage (any device can resume)
// ============================================================================================
const storageKey = () => `skillup_save_${conn.team}_${conn.slot}`;
const localKey = () => `skillup:${conn.seed}:${conn.team}:${conn.slot}`;
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let dirty = false;
const roomId = () => `${conn.seed}:${conn.team}:${conn.slot}`;
function save(remote = true) {
  if (!S || !conn) return;
  S.savedAt = Date.now();
  S.room = roomId();
  lsSet(localKey(), JSON.stringify(S));
  if (remote && ws && ws.readyState === 1)
    send([{ cmd: "Set", key: storageKey(), default: null, want_reply: false, operations: [{ operation: "replace", value: S }] }]);
  rememberRoom();
  dirty = false;
}
function loadSave(remote) {
  let local = null;
  try { local = JSON.parse(lsGet(localKey()) || "null"); } catch {}
  const pick = [remote, local].filter(x => x && x.v === SAVE_VERSION && (!x.room || x.room === roomId()))
    .sort((a, b) => b.savedAt - a.savedAt)[0];
  S = Object.assign(newSave(), pick || {});
  for (const k of ["level", "xp", "speedLv", "xpLv"]) S[k] = { ...newSave()[k], ...S[k] };
}

// ============================================================================================
// Archipelago connection
// ============================================================================================
let ws = null, conn = null, nameToLoc = null, itemIdToName = {}, checked = new Set(), playerGames = {};
const gamesPackage = {};
function send(packets) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(packets)); }

let sock = 0;   // bumps on every new connection; handlers from an older one are ignored
function connect(server, slotName, password) {
  server = server.trim();
  if (ws) { ws.onclose = ws.onmessage = null; ws.close(); }
  const mine = ++sock;
  const urls = /^wss?:\/\//.test(server) ? [server] : location.protocol === "https:" ? [`wss://${server}`] : [`wss://${server}`, `ws://${server}`];
  $("c-err").textContent = "Connecting…";
  let attempt = 0, opened = false, room = null;
  const open = () => {
    if (mine !== sock) return;
    ws = new WebSocket(urls[attempt]);
    ws.onopen = () => { opened = true; };
    ws.onmessage = ev => { if (mine === sock) for (const pkt of JSON.parse(ev.data)) handle(pkt); };
    ws.onclose = () => {
      if (mine !== sock) return;
      if (!opened && ++attempt < urls.length) return open();
      setOnline(false);
      if (!S) { $("c-err").textContent = "Could not connect. Check the server address and port."; return; }
      log(`<span class="sys">Disconnected. Retrying in 10 seconds; your progress keeps going and is saved in this browser.</span>`);
      setTimeout(() => { if (mine === sock && (!ws || ws.readyState > 1)) { attempt = 0; opened = false; open(); } }, 10000);
    };
  };
  function wrongRoom() { // the address now hosts something else: stop without sending anything
    sock++; ws.onclose = ws.onmessage = null; ws.close(); setOnline(false);
    log(`<span class="sys">This address now hosts a different room, so nothing was sent. Your progress here is saved. Click your name at the top to connect to another room.</span>`);
    toast("The server now hosts a different room. Nothing was sent.");
  }
  function handle(pkt) {
    switch (pkt.cmd) {
      case "RoomInfo":
        room = pkt;
        if (S && conn && pkt.seed_name !== conn.seed) return wrongRoom();
        { const need = pkt.games.filter(gm => !gamesPackage[gm]);   // reconnects reuse what we have
          if (need.length) send([{ cmd: "GetDataPackage", games: need }]); else handle({ cmd: "DataPackage", data: { games: {} } }); }
        break;
      case "DataPackage": {
        Object.assign(gamesPackage, pkt.data.games);
        const pkg = gamesPackage[GAME];
        if (!pkg) { $("c-err").textContent = "This room has no SkillUp game."; ws.onclose = null; ws.close(); return; }
        nameToLoc = pkg.location_name_to_id;
        itemIdToName = Object.fromEntries(Object.entries(pkg.item_name_to_id).map(([k, v]) => [v, k]));
        send([{ cmd: "Connect", game: GAME, name: slotName, password: password || "", uuid: uuid(),
          version: { major: 0, minor: 6, build: 7, class: "Version" }, items_handling: 0b111, tags: [], slot_data: true }]);
        break;
      }
      case "ConnectionRefused": {
        const pw = (pkt.errors || []).includes("InvalidPassword");
        const msg = pw ? "This room needs a password." : "The server refused the connection: " + (pkt.errors || []).join(", ");
        if (S) log(`<span class="sys">${esc(msg)} Reload the page to try again.</span>`);
        else { $("c-err").textContent = msg; if (pw) $("c-pass").focus(); }
        ws.onclose = null; ws.close(); setOnline(false);
        break;
      }
      case "Connected":
        if (S && conn && (room.seed_name !== conn.seed || pkt.team !== conn.team || pkt.slot !== conn.slot)) return wrongRoom();
        slotData = pkt.slot_data || {};
        conn = { seed: room.seed_name, team: pkt.team, slot: pkt.slot, slotName, server, players: Object.fromEntries(pkt.players.map(p => [p.slot, p.alias || p.name])) };
        checked = new Set(pkt.checked_locations);
        playerGames = Object.fromEntries(Object.entries(pkt.slot_info || {}).map(([k, v]) => [k, v.game]));
        if (slotData.death_link) send([{ cmd: "ConnectUpdate", tags: ["DeathLink"] }]);
        setOnline(true);
        if (S) { resendAllChecks(); flushChecks(); checkGoal(true); break; }   // reconnect: keep playing
        send([{ cmd: "Get", keys: [storageKey()] }]);
        break;
      case "Retrieved":
        if (!S && conn && storageKey() in pkt.keys) { loadSave(pkt.keys[storageKey()]); applyItems(); startGame(); }
        break;
      case "ReceivedItems":
        if (pkt.index === 0) received = [];
        if (pkt.index !== received.length) { send([{ cmd: "Sync" }]); break; }
        received.push(...pkt.items);
        applyItems();
        if (S) render();
        break;
      case "RoomUpdate":
        (pkt.checked_locations || []).forEach(i => checked.add(i));
        break;
      case "PrintJSON":
        log(renderJson(pkt.data), pkt.type === "Hint" ? "hint" : "");
        if (pkt.type === "ItemSend" && conn && pkt.item?.player === conn.slot) {
          const item = renderJson([{ type: "item_id", text: String(pkt.item.item), player: pkt.receiving, flags: pkt.item.flags }]);
          popup(pkt.receiving === conn.slot ? `You found your ${item}`
            : `Sent ${item} to ${renderJson([{ type: "player_id", text: String(pkt.receiving) }])}`, "sent");
        }
        break;
      case "Bounced":
        if ((pkt.tags || []).includes("DeathLink") && pkt.data?.source !== conn?.slotName && S) {

function perHour(k, e, craft) { // time per attempt, color, and skill levels per hour

  if (c.name === "red") { t *= c.slow; xp *= c.chance; }
  return { c, t, hr: S.level[k] >= cap(k) ? 0 : 3600 * xp * gameSpeed() * (1 + S.xpLv[k] * BAL.gold.xp_step) / t / xpNeed(S.level[k]) };

function perHourFight(m) {

// The game moves 4 times a second; the bars are drawn every frame from the time since then, so they glide.
function paintBars() {
  if (!S) return;
  const since = Math.min((performance.now() - lastTick) / 1000, .5);
  for (const bar of $("slots").querySelectorAll("[data-cast]")) {
    const slot = bar.dataset.cast, a = actionOf(slot);
    if (!a) continue;
    const back = slot === "field" ? S.corpseUntil - S.clock - since : 0;
    if (S.corpseUntil > S.clock && slot === "field") {   // corpse run: the bar counts down to when you're back
      bar.firstElementChild.style.width = (clamp(1 - back / C.corpse_run, 0, 1) * 100).toFixed(2) + "%";
      bar.lastElementChild.textContent = `Back in ${Math.max(0, Math.ceil(back))}s`;
      continue;
    }
    const moving = slot === "field" || !missing(a.entry);
    const t = Math.min(a.time, (slot === "field" ? S.fieldT : S.workT) + (moving ? since : 0));
    bar.firstElementChild.style.width = (t / a.time * 100).toFixed(2) + "%";
    bar.lastElementChild.textContent = a.kind === "ragnaros" ? `${fmtT(t)} / ${fmtT(a.time)}` : `${t.toFixed(1)}s / ${a.time.toFixed(1)}s`;
  }
  const fight = $("slots").querySelector("[data-fight]"), a = actionOf("field");
  if (!fight || !a || a.kind !== "mob") return;
  const m = a.entry, fb = fightBars(m, a.time, Math.min(a.time, S.fieldT + since), fateFor(m).dies);
  const [foeBar, youBar] = fight.querySelectorAll(".sbar");
  foeBar.firstElementChild.style.width = pct(fb.foe / fb.foeMax);
  foeBar.querySelector("span > span:last-child").textContent = `${fb.foe.toLocaleString("en-US")} / ${fb.foeMax.toLocaleString("en-US")}`;
  youBar.firstElementChild.style.width = pct(fb.you / fb.youMax);
  youBar.querySelector("span > span:last-child").textContent = `${fb.you.toLocaleString("en-US")} / ${fb.youMax.toLocaleString("en-US")}`;
}

  else if (p.kind === "combat") body = combatHtml();

  $("detail").html = head + tabs + body;
}
function checkLabel(done) { return `<span class="chk ${done ? "done" : "todo"}" title="${done ? "Check already sent" : "Doing this the first time sends a check"}">${done ? "✓ Sent" : "◆ Check"}</span>`; }
function rowsHtml(k) {
  const kind = P[k].kind === "crafting" ? "craft" : "gather";
  const list = thingsOf(k, tab).concat(kind === "craft" && tab === 3 && moltenCore ? GD.fire_resistance_set.filter(f => f.profession === k) : []);
  const bagIcon = ic(GD.ui_icons.slot_Bag);
  return `<div class="rows">` + list.map((e, i) => {
    const hr = kind === "craft" ? perHourCraft(k, e) : perHourGather(k, e);
    const running = (S.field && S.field.name === e.name) || (S.work && S.work.name === e.name);
    const done = e.legendary ? S.crafted.includes(e.name) : S.firsts.includes(e.name);
    const mats = kind === "craft"
      ? `<ul class="mats">${e.reagents.map(n => { const have = Math.floor(S.stock[n] || 0), need = qtyOf(e);
          return `<li class="${have < need ? "short" : ""}" data-item="${esc(n)}"><img src="${ic(BY_NAME[n].icon)}" alt=""><span>${need}× ${esc(n)}</span><span class="have">${have}</span></li>`; }).join("")}</ul>`
      : `<ul class="mats"><li><img src="${bagIcon}" alt=""><span>In bags</span><span class="have">${Math.floor(S.stock[e.name] || 0)} / ${bagCap()}</span></li></ul>`;
    const rate = hr.c.name === "red" ? `<b class="c-red">${pct(hr.c.chance)}</b> per try<br><span title="Average time per success">~${fmtT(hr.t / hr.c.chance)} per success</span>`
      : hr.hr > 0 ? `${pace(hr.hr)}<br><span>${fmtT(hr.t)} each</span>` : `${S.level[k] >= 300 ? "Maxed" : e.legendary ? "Legendary" : "no skill"}<br><span>${fmtT(hr.t)} each</span>`;
    const legendLbl = e.legendary && !list[i - 1]?.legendary ? `<div class="legendary-lbl" style="grid-column:1/-1">Legendary · for Ragnaros</div>` : "";
    return `${legendLbl}<div class="row"><img class="icon" src="${ic(e.icon)}" alt="" data-item="${esc(e.name)}">
      <div class="info"><div class="nmline"><span class="nm q${e.quality}" data-item="${esc(e.name)}">${esc(e.name)}</span></div>
        <div class="meta">${lvl(hr.c, e.unlock)}${kind === "craft" ? `<span class="cat">${esc(e.role || e.slot)}</span>` : ""}</div>${mats}</div>
      ${e.legendary ? `<span></span>` : checkLabel(done)}
      <div class="rate">${rate}</div>
      <div class="act"><button class="wbtn ${running ? "on" : ""}" data-do="${kind}" data-name="${esc(e.name)}">${running ? "Stop" : kind === "craft" ? "Craft" : "Gather"}</button></div></div>`;
  }).join("") + `</div>`;
}
function combatHtml() {
  const zone = GD.mobs.filter(m => m.rank === tab);
  const yours = gearLevel();
  return `<div class="zone"><span class="title">${zone[0].zone}</span><span class="mute" style="font-size:13.5px">Every creature drops ${zone[0].cloth}</span></div><div class="mobs">` +
    zone.map(m => {
      const r = perHourFight(m), seen = S.firsts.includes(m.name), locked = S.level.combat < m.unlock;
      const rec = recommended(m), running = S.field?.kind === "mob" && S.field.name === m.name;
      const verdict = r.win >= .995 ? `<span class="verdict v-safe" title="You always win with your gear">Safe</span>`
        : `<span class="verdict ${r.win >= .5 ? "v-risky" : "v-deadly"}" title="You win ${pct(r.win)} of fights with your gear">${r.win >= .5 ? "Risky" : "Deadly"} · ${pct(r.win)}</span>`;
      const gear = `<span class="gear" style="color:${glColor(rec)}" title="Gear Level ${rec}: the armor you need to always win this fight. Yours is ${yours}. Your weapon only changes how fast you kill."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>Gear Level ${rec}</span>`;
      return `<div class="mob ${m.boss ? "boss" : ""}"><img src="${m.image}" alt="">
        ${m.trait ? `<span class="trait" title="${GD.traits[m.trait].text}">${m.trait}</span>` : ""}
        <div class="plate"><span class="nm">${m.name}</span>
        <span class="lv">${lvl(r.c, m.unlock)} Level ${m.level}${m.classification !== "Normal" ? " · " + m.classification : ""} · <span class="mhp">${Math.round(needDps(m) * mobBase(m)).toLocaleString("en-US")} HP</span></span></div>
        <div class="gearrow">${gear}${locked ? "" : verdict}</div>
        <div class="rate">${locked ? `<span class="mute">Not enough Combat skill yet</span>` : `${r.hr > 0 ? pace(r.hr) : "no skill"} · ${fmtT(r.t)} per kill`}</div>
        ${checkLabel(seen)}
        ${locked ? `<button class="wbtn" disabled>Requires Combat ${m.unlock}</button>` : `<button class="wbtn ${running ? "on" : ""}" data-do="mob" data-name="${esc(m.name)}">${running ? "Stop" : "Fight"}</button>`}</div>`;
    }).join("") + `</div>`;
}
function glColor(v) {
  const stops = [[0, [157, 157, 157]], [20, [255, 255, 255]], [40, [30, 255, 0]], [60, [0, 112, 221]], [80, [163, 53, 238]], [100, [255, 128, 0]]];
  v = clamp(v, 0, 100);
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i], f = (v - a) / (b - a);
    return `rgb(${ca.map((c, j) => Math.round(c + (cb[j] - c) * f)).join(",")})`;
  }
  return "rgb(255,128,0)";
}

function eqBox(name, slot, extra = "", tip = "") {
  if (!name) return `<div class="eq empty" title="${slot}: empty"><img src="${ic(GD.ui_icons["slot_" + slot] || GD.ui_icons.slot_Bag)}" alt="${slot} empty"></div>`;
  const e = BY_NAME[name];
  return `<div class="eq q${e.quality || 1}" data-item="${esc(name)}"${tip ? ` data-note="${esc(tip)}"` : ""}><img src="${ic(e.icon)}" alt="${esc(name)}">${extra}</div>`;
}
function renderPane() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === rtab));
  const el = $("pane");
  if (rtab === "char") {
    const gl = gearLevel(), fighting = S.field?.kind === "mob" ? MOB[S.field.name] : null;
    const now = fighting ? (WEAPONS.find(w => S.weapons[w] && GD.traits[fighting.trait]?.weapon === w) || (S.weapons.Sword ? "Sword" : null)) : null;
    const buffs = BUFF_ROLES.filter(r => active(S.buffs, r)).map(r => eqBox(S.buffs[r].name, "", `<span class="timer">${fmtT(S.buffs[r].until - S.clock)}</span>`, r));
    const supplies = Object.entries(S.supplies).flatMap(([kind, list]) => list.length ? [eqBox(list[0], "", `<span class="count">${list.length}</span>`, kind)] : []);
    el.html = `<div class="doll">
        <div class="col">${["Head", "Shoulder", "Back", "Chest"].map(s => eqBox(S.armor[s], s)).join("")}</div>
        <div class="stats"><div><div class="v" title="DPS: damage per second with your best weapon, Shop speed included. A weapon matching a creature's trait deals more.">${Math.round(weaponDps(null) * speed("combat"))}</div><div class="k">DPS</div></div>
          <div><div class="v hp" title="HP: refills after every fight. Armor and combat food raise it.">${Math.round(maxHp()).toLocaleString("en-US")}</div><div class="k">HP</div></div>
          <div title="Gear Level: the average of your 7 armor slots (white 20, green 40, blue 60, purple 80, legendary 100). Empty slots count as 0."><div class="v gl" style="color:${glColor(gl)}">${gl}</div><div class="k">Gear Level</div><div class="glbar"><i style="left:${gl}%"></i></div></div></div>
        <div class="col">${["Hands", "Legs", "Feet"].map(s => eqBox(S.armor[s], s)).join("")}</div></div>
      <div class="weapons" style="margin-top:14px">${WEAPONS.map(w => `<div class="${w === now ? "now" : ""}">${S.weapons[w] ? eqBox(S.weapons[w], "MainHand")
        : `<div class="eq empty" title="${w}: ${STRONG[w]} Craft one with Blacksmithing."><img src="${ic(GD.ui_icons.slot_MainHand)}" alt="${w} empty"></div>`}${w}</div>`).join("")}</div>
      <div class="subh">Tools</div>
      <div class="irow">${GATHER.slice().sort().map(k => S.tools[k] ? eqBox(S.tools[k], "MainHand") : `<div class="eq empty" title="${P[k].name} tool: craft one with Engineering"><img src="${ic(P[k].icon)}" alt="" style="filter:grayscale(1)"></div>`).join("")}</div>
      <div class="subh">Buffs <span>· one of each kind</span></div><div class="irow">${buffs.join("") || `<span class="mute small">None running. Craft potions and food.</span>`}</div>
      <div class="subh">Supplies <span>· up to ${BAL.buffs.keep} each</span></div><div class="irow">${supplies.join("") || `<span class="mute small">None yet.</span>`}</div>`;
  } else if (rtab === "shop") {
    const track = (k, label, lv, step, kind) => {
      const cost = shopCost(lv), can = cost <= S.gold, max = lv >= BAL.gold.steps;
      return `<div class="trk"><span class="tl">${label}</span>${pips(lv)}<span class="bonus">+${Math.round(lv * step * 100)}%</span>
        ${max ? `<span class="maxed">Max</span>` : `<button class="wbtn ${can ? "" : "dim"}" data-buy="${k}:${kind}" title="${can ? "Buy level " + (lv + 1) : "Not enough gold"}"><span class="coins">${coins(cost, true)}</span></button>`}</div>`;
    };
    el.html = `<div class="shophead"><span>Permanent upgrades. Each level costs double the last.</span><span class="coins">${coins(S.gold)}</span></div>` +
      GROUPS.map(([label, kind]) => `<div class="glabel" style="padding:12px 0 2px">${label}</div>` + byKind(kind).map(p =>
        `<div class="trainer"><img class="icon" src="${ic(p.icon)}" alt=""><div class="tn">${p.name}</div>
        ${track(p.key, "Speed", S.speedLv[p.key], BAL.gold.speed_step, "speed")}${track(p.key, "XP", S.xpLv[p.key], BAL.gold.xp_step, "xp")}</div>`).join("")).join("");
  } else if (rtab === "bags") {
    const mats = GD.materials.filter(m => (S.stock[m.name] || 0) >= 1);
    const total = mats.reduce((t, m) => t + Math.floor(S.stock[m.name]) * sellValue(m.name), 0);
    el.html = `<div class="shophead"><span>Up to ${bagCap()} of each. Extras sell while you play; nothing sells while the page is closed.</span>
        ${mats.length ? `<button class="wbtn" data-sellall="1">Sell everything · <span class="coins">${coins(total, true)}</span></button>` : ""}</div>` +
      (mats.map(m => { const n = Math.floor(S.stock[m.name]); return `<div class="li"><img class="icon sm" src="${ic(m.icon)}" alt="" data-item="${esc(m.name)}">
        <span class="q${m.quality}" data-item="${esc(m.name)}">${esc(m.name)}</span><button class="wbtn" style="padding:1px 8px;font-size:12.5px" data-sell="${esc(m.name)}">Sell all</button>
        <div class="sbar ${n >= bagCap() ? "full" : ""}"><i style="width:${pct(n / bagCap())}"></i><span><span></span><span>${n} / ${bagCap()}</span></span></div></div>`; }).join("")
      || `<p class="mute">Your bags are empty.</p>`);
  } else {
    renderLog(el);
  }
}
function renderGoal() {
  const g = slotData.goal || "ragnaros", need = slotData.professions_to_master || 6;
  const showRag = g !== "master_professions", showMaster = g !== "ragnaros";
  const legendary = ARMOR_SLOTS.filter(s => S.armor[s] && BY_NAME[S.armor[s]].legendary).length;
  const odds = ragnarosOdds();
  const reqs = ["combat", "blacksmithing", "leatherworking", "tailoring", "alchemy", "cooking"];
  let html = `<img src="https://wow.zamimg.com/modelviewer/classic/webthumbs/npc/113/11121.png" alt="Ragnaros"><div>`;
  if (showRag) html += `<div class="title" style="font-size:15px">Defeat Ragnaros</div><ul>
      ${moltenCore ? `<li class="ok">✓ Molten Core</li>` : `<li class="no">✗ Molten Core (from the multiworld)</li>`}
      <li class="${legendary === 7 ? "ok" : "no"}">${legendary === 7 ? "✓" : "·"} Legendary armor ${legendary} / 7</li>
      ${S.ragnarosWon ? `<li class="ok">✓ Ragnaros defeated</li>` : moltenCore ? `<li><button class="wbtn ragbtn" data-rag="1" ${S.field?.kind === "ragnaros" ? "disabled" : ""}>Fight Ragnaros · win ${pct(odds.win)}</button></li>` : ""}</ul>`;
  if (showMaster) html += `<div class="title" style="font-size:15px;margin-top:6px">Master Professions</div><ul>
      <li><b>Professions at 300: ${masteredCount()} / ${need}</b></li></ul>`;
  if (showRag && !showMaster) html += `<ul><li class="mute">Ready when these are at 300: ${reqs.map(k => `<span class="${S.level[k] >= 300 ? "ok" : ""}">${P[k].name}</span>`).join(", ")}</li></ul>`;
  $("goal").html = html + `</div>`;
}
function render() {
  if (!S) return;
  renderHeader(); renderList(); $("vt-main").textContent = P[selected].name; renderSlots(); renderDetail(); renderPane(); renderGoal();
  refreshTip();
}

// ---- input -------------------------------------------------------------------------------
document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t || !S) return;
  if (t.matches(".prof")) { selected = t.dataset.k; tab = Math.max(0, (ranks[selected] || 1) - 1); showView("main"); render(); return; }
  if (t.dataset.t !== undefined) { tab = +t.dataset.t; renderDetail(); return; }
  if (t.dataset.tab) { rtab = t.dataset.tab; renderPane(); return; }
  if (t.dataset.do) {
    const name = t.dataset.name, slot = t.dataset.do === "craft" ? "work" : "field";
    const same = S[slot] && S[slot].name === name;
    S[slot] = same ? null : { kind: t.dataset.do === "mob" ? "mob" : t.dataset.do, name };
    if (slot === "field") S.fieldT = 0; else S.workT = 0;
    dirty = true; render(); return;
  }
  if (t.dataset.buy) { const [k, kind] = t.dataset.buy.split(":"); buy(k, kind); dirty = true; return; }
  if (t.dataset.sell) { sellAll(t.dataset.sell); dirty = true; return; }
  if (t.dataset.sellall) { sellEverything(); dirty = true; return; }
  if (t.dataset.rag) { S.field = { kind: "ragnaros", name: "Ragnaros" }; S.fieldT = 0; dirty = true; render(); return; }
});
// Phone: the tab bar shows one view at a time (Professions, the open profession, Character).
function showView(v) { document.body.dataset.view = v; window.scrollTo(0, 0); }
$("vtabs").onclick = ev => { const b = ev.target.closest("[data-view]"); if (b) showView(b.dataset.view); };
$("to-connect").onclick = () => { save(); location.href = location.pathname; };

// ---- connect screen ------------------------------------------------------------------------
function showRecent() {
  let rooms = [];
  try { rooms = JSON.parse(lsGet("skillup:rooms") || "[]"); } catch {}
  $("recent").html = rooms.length ? `<div class="glabel" style="padding:0">Recent rooms</div>` + rooms.map(r =>
    `<button type="button" data-server="${esc(r.server)}" data-slot="${esc(r.slot)}"><b>${esc(r.slot)}</b><span class="mute" style="font-size:12.5px">${new Date(r.at).toLocaleDateString()}</span>
     <span class="mute" style="font-size:13px">${esc(r.server)} · ${r.done ? "Goal complete" : `${r.checks}/220 checks`}</span></button>`).join("") : "";
  $("recent").querySelectorAll("button").forEach(b => b.onclick = () => { $("c-server").value = b.dataset.server; $("c-slot").value = b.dataset.slot; $("connect-form").requestSubmit(); });
}
$("connect-form").addEventListener("submit", ev => {
  ev.preventDefault();
  const server = $("c-server").value || "archipelago.gg:38281", slot = $("c-slot").value.trim();
  if (!slot) { $("c-err").textContent = "Enter your slot name."; return; }
  connect(server, slot, $("c-pass").value);
});
{
  const q = new URLSearchParams(location.search);
  if (q.get("server")) $("c-server").value = q.get("server");
  if (q.get("slot")) $("c-slot").value = q.get("slot");
  showRecent();
  // A bookmarked link with both server and slot goes straight into the game.
  if (q.get("server") && q.get("slot")) $("connect-form").requestSubmit();
}

// ---- main loop ------------------------------------------------------------------------------
let lastTick = 0;
function startGame() {
  $("connect").hidden = true;
  ["top", "vtabs", "game", "foot"].forEach(id => $(id).hidden = false);
  if (!learned(selected)) selected = PROFS.find(p => learned(p.key))?.key || "combat";
  tab = Math.max(0, (ranks[selected] || 1) - 1);
  catchUpOffline();
  resendAllChecks(); flushChecks(); checkGoal(true);
  save();
  render();
  lastTick = performance.now();
  setInterval(tick, 250);
  requestAnimationFrame(frame);
  setInterval(() => { if (dirty) save(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
  window.addEventListener("pagehide", () => save());
}
let renderAcc = 0;
function tick() {
  const now = performance.now(), dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt > 300) { catchUp(dt); render(); return; }
  advance(dt, false);
  if (S.field || S.work) dirty = true;
  flushChecks(); checkGoal();
  renderAcc += dt;
  renderSlots();
  if (renderAcc >= 1) { renderAcc = 0; render(); }
}

</script>
